<!DOCTYPE html>
<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#090909;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
padding:25px;
}

.container{

max-width:420px;
width:100%;
text-align:center;

}

.logo{

width:90px;
height:90px;
border-radius:20px;
margin:auto;
margin-bottom:25px;
overflow:hidden;

}

.logo img{

width:100%;
height:100%;
object-fit:cover;

}

h1{

font-size:34px;
font-weight:700;
margin-bottom:8px;

}

p{

color:#999;
margin-bottom:35px;

}

.button{

display:block;
width:100%;
padding:17px;
margin-bottom:15px;

text-decoration:none;

color:white;

border:1px solid #333;

border-radius:16px;

transition:.25s;

font-weight:600;

background:#151515;

}

.button:hover{

background:white;
color:black;

transform:translateY(-2px);

}

.location{

margin-top:25px;

color:#777;

font-size:15px;

}
